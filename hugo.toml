baseURL = "https://siddeshsambasivam.com/"
locale = "en-us"
title = "Sid's Website"
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
summaryLength = 30

# Pretty URLs, no ugly extensions
[permalinks]
  projects = "/projects/:contentbasename/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false
    style = "github"
    guessSyntax = true
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
    permalinkable = false

[taxonomies]
  tag = "tags"

[params]
  description = "Engineering lead at Hypotenuse AI, building LLM infrastructure for ecommerce product data at scale."
  author = "Siddesh Sambasivam Suseela"
  brand = "sid"
  hero_name = "Hi, I'm Sid"
  hero_emoji = "👋"
  hero_tagline_html = "Engineering lead at <a href=\"https://hypotenuse.ai\" target=\"_blank\">Hypotenuse AI</a>, building LLM infrastructure for ecommerce product data at scale."
  defaultTheme = "light"
  copyright_year = 2026

  hero_bullets = []
  # Show the "Selected work" project list on the home page.
  home_projects = false

  # Umami Cloud page views and click events. Empty = no tracking.
  # Loads only in production builds on the baseURL domain, so local and preview visits aren't counted.
  [params.analytics]
    umami_website_id = "fb817710-aad6-43ee-b23c-ea5b5434ddd8"

  [params.giscus]
    repo = "SiddeshSambasivam/siddeshsambasivam.com"
    repo_id = "R_kgDOSAUb5g"
    category = "General"
    category_id = "DIC_kwDOSAUb5s4C8OIU"
    mapping = "pathname"

  # Geo metadata for GEO/local SEO
  [params.geo]
    region = "SG"
    placename = "Singapore"
    latitude = "1.3521"
    longitude = "103.8198"

  [params.socials]
    github = "https://github.com/SiddeshSambasivam"
    linkedin = "https://www.linkedin.com/in/siddeshss/"
    x = "https://x.com/SiddSambasivam"
    scholar = "https://scholar.google.com/citations?user=cK5ea-cAAAAJ&hl=en"
    garden = "https://notes.siddeshsambasivam.com/"
    email = "mailto:siddeshsambasivam.official@gmail.com"
    rss = "/index.xml"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
    identifier = "home"
  [[menu.main]]
    name = "Writing"
    url = "/writing/"
    weight = 20
    identifier = "writing"
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 30
    identifier = "projects"
  [[menu.main]]
    name = "Notes"
    url = "https://notes.siddeshsambasivam.com/"
    weight = 40
    identifier = "notes"
    [menu.main.params]
      external = true

[build]
  writeStats = true

[minify]
  minifyOutput = true

# Fetch remote files (the app download manifest) fresh on every build.
# Netlify keeps Hugo's cache between builds, so a cached manifest would pin an old release.
[caches.getresource]
  maxAge = 0
