{{- if and (ne .Params.comments false) (eq .Section "writing") -}}
<div class="comments">
  <h3>Comments</h3>
  {{- $g := site.Params.giscus -}}
  {{- if and $g $g.repo -}}
  <div id="giscus-container"></div>
  <script>
    (function () {
      var theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('data-repo', '{{ $g.repo }}');
      s.setAttribute('data-repo-id', '{{ $g.repo_id }}');
      s.setAttribute('data-category', '{{ $g.category | default "General" }}');
      s.setAttribute('data-category-id', '{{ $g.category_id }}');
      s.setAttribute('data-mapping', '{{ $g.mapping | default "pathname" }}');
      s.setAttribute('data-strict', '0');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'top');
      s.setAttribute('data-theme', theme);
      s.setAttribute('data-lang', 'en');
      document.getElementById('giscus-container').appendChild(s);
    })();
  </script>
  {{- else -}}
  <div class="comment-box">
    Comments are powered by <a href="https://giscus.app">giscus</a>. Configure <code>params.giscus</code> in <code>hugo.toml</code> to enable.
  </div>
  {{- end -}}
</div>
{{- end -}}
