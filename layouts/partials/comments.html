{{- if and (ne .Params.comments false) (eq .Section "writing") -}}
<div class="comments">
  <h3>Comments</h3>
  {{- $g := site.Params.giscus -}}
  {{- if and $g $g.repo -}}
  <script src="https://giscus.app/client.js"
    data-repo="{{ $g.repo }}"
    data-repo-id="{{ $g.repo_id }}"
    data-category="{{ $g.category | default "General" }}"
    data-category-id="{{ $g.category_id }}"
    data-mapping="{{ $g.mapping | default "pathname" }}"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
  {{- else -}}
  <div class="comment-box">
    Comments are powered by <a href="https://giscus.app">giscus</a>. Configure <code>params.giscus</code> in <code>hugo.toml</code> to enable.
  </div>
  {{- end -}}
</div>
{{- end -}}
